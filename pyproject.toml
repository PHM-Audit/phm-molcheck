[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phm-molcheck"
version = "1.0.0"
description = "Deterministic physical-validity gate for AI-generated molecular/protein structures (PDB-level, no RDKit required)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "PHM-Audit" }]
keywords = ["ai-generated", "molecules", "proteins", "pdb", "clash", "validation", "drug-discovery", "structure-quality", "deterministic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.20"]

[project.urls]
Homepage = "https://github.com/PHM-Audit/phm-molcheck"

[tool.setuptools.packages.find]
include = ["phm_molcheck*"]
